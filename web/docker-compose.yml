version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: udharco-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-udharco_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-udharco_production}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udharco_admin -d udharco_production"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
